<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Coffee Store</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }

        body {
            background: #1D1E22;
            color: white;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .admin-container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 { margin-bottom: 30px; text-align: center; }
        h1 span { color: #ffa74f; }
        h2 { margin-bottom: 20px; font-size: 20px; }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 13px;
            padding: 25px;
            margin-bottom: 30px;
        }

        /* Form */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-group.full { grid-column: 1 / -1; }

        label { font-size: 14px; font-weight: bold; color: #ddd; }

        input, select, textarea {
            padding: 12px;
            border-radius: 8px;
            border: 2px solid transparent;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus, select:focus, textarea:focus { border-color: #ffa74f; }
        select option { color: black; }
        textarea { resize: vertical; min-height: 90px; }

        /* Buttons */
        .form-actions {
            display: flex;
            gap: 15px;
            justify-content: flex-end;
            margin-top: 25px;
        }

        .btn {
            padding: 12px 28px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            border: 2px solid #ffa74f;
            transition: 0.3s;
        }

        .btn-primary { background: #ffa74f; color: white; }
        .btn-primary:hover { box-shadow: 0 0 .6em rgba(255, 167, 79, 0.5); }
        .btn-secondary { background: transparent; color: white; }
        .btn-secondary:hover { background: rgba(255, 167, 79, 0.15); }

        /* Table */
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 14px 10px; text-align: left; }
        th { color: #ffa74f; font-size: 14px; border-bottom: 2px solid rgba(255, 255, 255, 0.1); }
        td { border-bottom: 1px solid rgba(255, 255, 255, 0.06); }
        tr:hover td { background: rgba(255, 255, 255, 0.03); }

        .thumb {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 8px;
        }

        .btn-small {
            padding: 6px 14px;
            border-radius: 15px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            background: transparent;
            border: 2px solid #ffa74f;
            color: white;
        }
        .btn-small:hover { background: #ffa74f; }
        .btn-delete { border-color: #e0524d; }
        .btn-delete:hover { background: #e0524d; }

        @media (max-width: 600px) {
            .form-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <h1>Coffee Store <span>Admin</span></h1>
        
        <div class="card">
            <h2>Add Product</h2>
            <form>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" placeholder="Black Coffee">
                    </div>

                    <div class="form-group">
                        <label for="price">Price ($)</label>
                        <input type="number" id="price" name="price" placeholder="15" min="0" step="0.01">
                    </div>

                    <div class="form-group">
                        <label for="category">Category</label>
                        <select id="category" name="category">
                            <option value="coffee">Coffee</option>
                            <option value="tea">Tea</option>
                            <option value="tea">Shake</option>
                            <option value="pastry">Pastry</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="image">Image</label>
                        <input type="file" id="image" name="image" accept="image/*">
                    </div>

                    <div class="form-group full">
                        <label for="description">Description</label>
                        <textarea id="description" name="description" placeholder="Hello World"></textarea>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="reset" class="btn btn-secondary">Clear</button>
                    <button type="button" class="btn btn-primary" onclick="add_new_product()">Save Product</button>
                </div>
            </form>
        </div>

        <!-- Product list -->
        <div class="card">
            <h2>Products</h2>
            <table>
                <thead>
                    <tr>
                        <th>Image</th>
                        <th>Name</th>
                        <th>Category</th>
                        <th>Price</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- JS will fill this later; example row: -->
                    <tr>
                        <td><img class="thumb" src="product_img/black_coffee.jpg" alt="Black Coffee"></td>
                        <td>Black Coffee</td>
                        <td>coffee</td>
                        <td>$15</td>
                        <td>
                            <button class="btn-small">Edit</button>
                            <button class="btn-small btn-delete">Delete</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
<script src="admin.js"></script>
</body>
</html>
